name: Release

# Pushing a tag such as v2.0.0 builds the Windows executable, runs the tests and
# publishes both the executable and its SHA-256 checksum as release assets - the
# download page an operator uses to deploy the tool.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v2.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests before publishing
        run: python -m pytest
      - name: Build the executable
        run: python -m PyInstaller --noconfirm usb-auth.spec
      - name: Verify the executable starts
        run: .\dist\USB-Authentication-Tool.exe --version
      - name: Write the checksum file
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\USB-Authentication-Tool.exe -Algorithm SHA256).Hash
          "$hash  USB-Authentication-Tool.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: USB Authentication Tool ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/USB-Authentication-Tool.exe
            dist/SHA256SUMS.txt
